name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test StudyKit
        run: swift test --package-path StudyKit

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project StudyAgent.xcodeproj \
            -scheme StudyAgent \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project StudyAgent.xcodeproj \
            -scheme StudyAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/StudyAgent.app Payload/
          zip -qry StudyAgent-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StudyAgent-unsigned-ipa
          path: StudyAgent-unsigned.ipa
          retention-days: 14
