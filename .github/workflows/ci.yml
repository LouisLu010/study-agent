name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Swift 6 里写在 @MainActor 代码中的闭包，如果被系统放到后台队列上调用会直接闪退，编译器不报警告。
      # BGTaskScheduler 的 using: nil 就是这样（v0.6.0 Beta 3 汇编一开就闪退），这里挡住它。
      - name: Check background-queue callbacks
        run: |
          if grep -rnE "register\(forTaskWithIdentifier:[^)]*using: nil" App; then
            echo "BGTaskScheduler.register 要用 using: .main" >&2
            exit 1
          fi

      - name: Test StudyKit
        run: swift test --package-path StudyKit

      - name: Test renderer
        run: node --test RendererTests/*.test.js

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test app on iOS Simulator
        run: |
          TEST_SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project StudyAgent.xcodeproj \
            -scheme StudyAgent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -derivedDataPath build/sim \
            -resultBundlePath build/AppTests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Upload app test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: build/AppTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project StudyAgent.xcodeproj \
            -scheme StudyAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/StudyAgent.app Payload/
          # 确认渲染器资源按目录结构打进了 App 包
          test -f Payload/StudyAgent.app/Renderer/index.html
          # 确认 App 图标编译进了包里
          ls Payload/StudyAgent.app | grep -q '^AppIcon' 
          test -f Payload/StudyAgent.app/Renderer/vendor/katex/fonts/KaTeX_Main-Regular.woff2
          zip -qry StudyAgent-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StudyAgent-unsigned-ipa
          path: StudyAgent-unsigned.ipa
          retention-days: 14
