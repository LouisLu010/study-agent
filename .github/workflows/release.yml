name: Release IPA

# 发布 GitHub Release 时，按它的标签编译未签名的 IPA，作为附件传到这个 Release 上。
# 已经发布过的 Release 可以在 Actions 页面手动运行这个工作流，填上它的标签来补传。
# 测试由 ci.yml 在每次推送时跑过，这里只编译和打包。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要补传安装包的 Release 标签，例如 v0.6.0-beta.1
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.-]+$ ]]; then
            echo "标签格式不对：$TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project StudyAgent.xcodeproj \
            -scheme StudyAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/StudyAgent.app Payload/
          # 和 ci.yml 一样，确认渲染器资源、App 图标和 KaTeX 字体都打进了包里
          test -f Payload/StudyAgent.app/Renderer/index.html
          ls Payload/StudyAgent.app | grep -q '^AppIcon'
          test -f Payload/StudyAgent.app/Renderer/vendor/katex/fonts/KaTeX_Main-Regular.woff2
          IPA="StudyAgent-$TAG-unsigned.ipa"
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
