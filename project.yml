name: StudyAgent

options:
  bundleIdPrefix: com.louislu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # App 只有中文。声明成中文后，日期（例如"2 小时前"）和系统自带的文字也按中文显示。
  developmentLanguage: zh-Hans

packages:
  StudyKit:
    path: StudyKit

targets:
  StudyAgent:
    type: application
    platform: iOS
    sources:
      - path: App
      # 渲染器作为文件夹引用整体放进 App 包，保留 vendor/katex/fonts 等相对路径。
      - path: Renderer
        type: folder
        buildPhase: resources
    dependencies:
      - package: StudyKit
    # 汇编在后台继续运行（见 docs/adr/0012）：系统长任务的标识符和定位保活。XcodeGen 生成这个文件，不提交。
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [location, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.louislu.studyagent.compilation.run, com.louislu.studyagent.compilation.*]
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
    settings:
      base:
        PRODUCT_NAME: StudyAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.louislu.studyagent
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        # 第六版起叫"格物"。Bundle ID 不变，覆盖安装时数据还在。
        INFOPLIST_KEY_CFBundleDisplayName: 格物
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 主题色取自图标的蓝色：浅色 #2563EB，深色 #4D8EFF。渲染器的 --accent 用同样的值。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSCameraUsageDescription: 拍下题目发给模型
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 只在打开"强力保活"并生成汇编时使用，让 App 在后台继续运行。不记录、不发送位置。
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

schemes:
  StudyAgent:
    build:
      targets:
        StudyAgent: all
